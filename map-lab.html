<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Strategic Map Lab</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="map-lab-page">
  <main class="map-lab-shell">
    <section class="panel map-lab-panel">
      <div class="panel-header">
        <div>
          <p class="eyebrow">Strategic Game Project</p>
          <h1>Map Generator Lab</h1>
          <p>Independent world generation preview. No units, cities, combat, or turn loop.</p>
        </div>
        <div class="control-row">
          <button id="showcase-map-btn" class="secondary-btn" type="button">Showcase Map</button>
          <button id="generate-map-btn" class="action-btn" type="button">Random Prototype</button>
        </div>
      </div>

      <div id="map-lab-profile" class="map-lab-profile"></div>
      <div class="map-frame">
        <div id="map-lab-grid" class="map map-lab-grid" aria-label="Generated map preview"></div>
      </div>
    </section>
  </main>

  <script src="mapGenerator.js"></script>
  <script src="mapLab.js"></script>
</body>
</html>
